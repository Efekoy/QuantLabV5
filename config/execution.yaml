# Execution policy (inherited from QuantLabV3 engine v2, see docs/INHERITED_FROM_V3.md).

version: execution_v4_2026-09-23
signal_timing: bar_close            # a signal at bar t is known at the CLOSE of bar t
entry: next_bar_open                # earliest fill: OPEN of bar t+1, same session and contract
ambiguity_policy: pessimistic       # stop assumed before target when both are inside one bar
target_trade_through_ticks: 1       # a resting target fills only if the bar trades 1 tick beyond it
stop_gap_fill: bar_open             # a gap through the stop fills at the (worse) open
position: single                    # one position at a time, no pyramiding
flat_on_session_end: true
flat_on_contract_roll: true
