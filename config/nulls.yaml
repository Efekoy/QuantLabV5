# Null / surrogate market infrastructure. No real null worlds have been run.

version: nulls_v4_2026-09-23

# Real data and every null world go through the SAME evaluator
# (quantlab5.search.pipeline.evaluate_candidates). There is no null-only evaluator.

generators:
  block_sign_flip:            # block-based directional randomisation
    block_minutes: 30
    joint: true               # NQ and ES share the same flips at the same minutes
  day_bootstrap:              # whole-session resampling with replacement
    joint: true               # NQ and ES draw the same session in each slot

worlds_per_run: 0             # set in a later protocol; nothing is run at bootstrap
base_seed: 20260923
