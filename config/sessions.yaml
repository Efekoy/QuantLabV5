# All session logic runs in America/New_York (DST handled by the tz database).
# (Inherited from QuantLabV3 config/sessions.yaml; the V3-hypothesis-specific
#  window "rth_late" was removed.)
#
# A CME "session" (trading day) starts at 18:00 New York the previous evening
# and runs to 17:00. Every session is labelled by the date it ENDS on, so the
# bars from Sunday 18:00 onward belong to Monday's session. This is the same
# convention as the source files' `roll_session` column (17:00 Chicago).
# Partition boundaries are session dates under this rule.

timezone: America/New_York
session_start: "18:00"

rth:                     # regular trading hours (cash session)
  start: "09:30"
  end: "16:00"

overnight:               # Globex hours before the cash open, inside the same session
  start: "18:00"
  end: "09:30"

# A final session in a source file is COMPLETE only if it contains a bar starting
# at this New York clock time (the last minute before the 17:00 maintenance break).
complete_session_last_bar: "16:59"

# Trading windows. A strategy may only OPEN a position on a bar whose start
# time is in [entry_start, entry_end). Every position is closed at the close of
# the last bar that starts before `flat_at`. No position can ever cross into
# the next session or across a contract roll.
windows:
  rth:     {entry_start: "09:30", entry_end: "15:30", flat_at: "16:00"}
  rth_am:  {entry_start: "09:30", entry_end: "12:00", flat_at: "16:00"}
  rth_pm:  {entry_start: "12:00", entry_end: "15:30", flat_at: "16:00"}
  globex:  {entry_start: "18:00", entry_end: "15:30", flat_at: "16:00"}
