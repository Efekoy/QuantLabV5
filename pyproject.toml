[project]
name = "quantlab5"
version = "5.0.0.dev0"
description = "QuantLabV5 - research infrastructure with sealed partitions, a stage gate and a hash-chained data-access ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=15", "numba>=0.60", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantlab5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
